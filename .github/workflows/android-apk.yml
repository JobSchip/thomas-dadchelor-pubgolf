name: Android APK — Thomas Pub Golf

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: thomas-android-apk
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build installable Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform for Capacitor 8
        run: sdkmanager "platforms;android-36"
      - name: Run multiplayer server tests
        run: npm test
      - name: Install Capacitor Android dependencies
        run: npm install --prefix ios-app --no-audit --no-fund
      - name: Generate native Android project
        run: npm run android:init --prefix ios-app
      - name: Validate locally bundled game screens
        run: npm run android:check --prefix ios-app
      - name: Build Android test APK
        working-directory: ios-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Prepare downloadable APK and checksum
        shell: bash
        run: |
          mkdir -p ios-app/dist
          cp ios-app/android/app/build/outputs/apk/debug/app-debug.apk ios-app/dist/Thomas-PubGolf-Android.apk
          cd ios-app/dist
          sha256sum Thomas-PubGolf-Android.apk > Thomas-PubGolf-Android.apk.sha256
          ls -lah Thomas-PubGolf-Android.apk
      - name: Upload Android APK for installation
        uses: actions/upload-artifact@v4
        with:
          name: Thomas-PubGolf-Android-APK
          path: ios-app/dist/
          if-no-files-found: error
          retention-days: 30
