name: Upload Thomas Pub Golf to TestFlight
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thomas-pubgolf-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Sign, archive and send to App Store Connect
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Apple signing secrets
        shell: bash
        run: |
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID"; exit 1; }
          test -n "$ASC_KEY_ID" || { echo "Missing ASC_KEY_ID"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "Missing ASC_ISSUER_ID"; exit 1; }
          test -n "$ASC_KEY_P8_BASE64" || { echo "Missing ASC_KEY_P8_BASE64"; exit 1; }
      - name: Install Capacitor and create the native iOS project
        run: |
          npm install --prefix ios-app --no-audit --no-fund
          npm run ios:init --prefix ios-app
      - name: Prepare App Store Connect API key securely
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/applekeys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/applekeys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/applekeys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/applekeys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Archive signed iPhone app
        shell: bash
        run: |
          xcodebuild \
            -project ios-app/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ThomasPubGolf.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive
      - name: Create upload configuration
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          EOF
      - name: Upload to TestFlight via Xcode
        shell: bash
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ThomasPubGolf.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove Apple key from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/applekeys"
