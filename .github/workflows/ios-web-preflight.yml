name: Pub Golf — Webapp checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'server.js'
      - 'tests/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - '.github/workflows/ios-web-preflight.yml'

permissions:
  contents: read

jobs:
  test-web:
    name: Verify gameplay, API and web assets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check web JavaScript syntax
        run: |
          node --check app.js
          node --check server.js
          node --check sw.js
      - name: Run complete multiplayer and UI test suite
        run: npm test
