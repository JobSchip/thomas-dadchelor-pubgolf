<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12352c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Thomas' Dadchelor — Haarlem Pub Golf">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./styles.css?v=6">
<title>Thomas' Pub Golf — Haarlem Open</title>
</head><body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">⛳</span><span>THOMAS' OPEN</span></div>
    <div class="top-actions">
      <span id="connection" class="connection-dot" aria-label="Status synchronisatie"></span>
      <button class="profile-switch" id="switcher" aria-label="Wissel spelersprofiel" title="Wissel speler">Wissel <span id="header-avatar">↗</span></button>
      <button class="menu-button" id="menu" aria-label="Open menu"><span></span><span></span></button>
    </div>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>
<input id="photo-input" type="file" accept="image/*" hidden>
<div id="effects" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="./app.js?v=6" defer></script>
</body></html>
