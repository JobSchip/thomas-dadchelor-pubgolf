<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Pre Papa Pluim Pub Golf — zes kroegen, één live klassement">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./styles.css?v=32">
<title>Pre Papa. Pluim Pub Golf.</title>
</head><body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">⛳</span><span>PRE PAPA PLUIM</span></div>
    <div class="top-actions">
      <span id="connection" class="connection-dot" aria-label="Status synchronisatie"></span>
      <button id="salmari-quick" class="salmari-quick" hidden aria-label="Salmari, één slag aftrek" title="Salmari: -1 slag">
  <span class="quick-shot" aria-hidden="true">
   <svg viewBox="0 0 70 92" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zwart Salmari-shotje">
    <defs><linearGradient id="shotGlass" x1="0" x2="1"><stop stop-color="#f6faf5" stop-opacity=".88"/><stop offset=".5" stop-color="#d7e3df" stop-opacity=".35"/><stop offset="1" stop-color="#f8fcfa" stop-opacity=".75"/></linearGradient></defs>
    <path d="M11 21 L59 21 L52 79 Q35 86 18 79Z" fill="url(#shotGlass)" stroke="#a2c5b7" stroke-width="3"/>
    <path d="M15 36 L55 36 L50 75 Q35 83 20 75Z" fill="#101010"/>
    <ellipse cx="35" cy="36" rx="20" ry="5" fill="#202020" stroke="#484848"/>
    <path d="M16 26 L20 69" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".65"/>
    <path d="M52 27 L49 64" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".35"/>
    <ellipse cx="35" cy="21" rx="24" ry="5" fill="none" stroke="#b5cfc7" stroke-width="3"/>
    <text x="35" y="60" text-anchor="middle" fill="#f2f0e9" font-size="9" font-weight="900" font-family="Arial">SALMARI</text>
   </svg>
  </span>
  <span class="quick-label">−1 slag</span>
  <span class="quick-count" id="salmari-count">0</span>
</button>
      <button class="menu-button" id="menu" aria-label="Open menu"><span></span><span></span></button>
    </div>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>
<input id="photo-input" type="file" accept="image/*" hidden>
<div id="effects" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="./app.js?v=32" defer></script>
</body></html>
